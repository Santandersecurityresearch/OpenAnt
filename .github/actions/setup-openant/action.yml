name: Setup OpenAnt
description: >
  Composite action: installs Go + Python, builds the openant CLI binary,
  installs Python core dependencies, and adds the binary to PATH.
  Caches the compiled binary (keyed on Go source hash), the Go module
  cache, and the Python package cache between runs.

inputs:
  python-version:
    description: Python version to install
    default: '3.11'
  go-version-file:
    description: Path to go.mod (used to pin Go version)
    default: apps/openant-cli/go.mod

outputs:
  openant-bin:
    description: Absolute path to the compiled openant binary
    value: ${{ steps.build.outputs.bin-path }}

runs:
  using: composite

  steps:
    # ------------------------------------------------------------------ Go
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: ${{ inputs.go-version-file }}
        cache-dependency-path: apps/openant-cli/go.sum

    # ------------------------------------------------------------------ Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: libs/openant-core/requirements.txt

    - name: Install Python dependencies
      shell: bash
      run: |
        pip install --quiet -r libs/openant-core/requirements.txt

    # ------------------------------------------------------------------ Build CLI
    # Cache the compiled binary — key includes OS and a hash of all Go source
    # files + go.sum so the cache is invalidated on any code change.
    - name: Cache openant binary
      id: cache-bin
      uses: actions/cache@v4
      with:
        path: apps/openant-cli/bin
        key: openant-bin-${{ runner.os }}-${{ hashFiles('apps/openant-cli/**/*.go', 'apps/openant-cli/go.sum') }}
        restore-keys: |
          openant-bin-${{ runner.os }}-

    - name: Build openant CLI
      id: build
      shell: bash
      run: |
        cd apps/openant-cli
        if [ "${{ steps.cache-bin.outputs.cache-hit }}" != "true" ]; then
          go build -o bin/openant .
          echo "Built openant binary from source."
        else
          echo "Restored openant binary from cache (skipping build)."
        fi
        BIN_PATH="$(pwd)/bin/openant"
        echo "bin-path=${BIN_PATH}" >> "$GITHUB_OUTPUT"
        echo "$(pwd)/bin" >> "$GITHUB_PATH"

    # ------------------------------------------------------------------ Smoke test
    - name: Verify openant is runnable
      shell: bash
      run: openant version
