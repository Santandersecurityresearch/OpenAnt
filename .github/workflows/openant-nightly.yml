name: OpenAnt Security Audit (Nightly)

# Full-repo audit: every function scanned, Opus model, agentic enhancement,
# Stage 2 verification. Runs Monday and Wednesday; can be triggered manually.
#
# Supports matrix scanning: pass a JSON array of languages to run a separate
# parallel audit job per language (e.g. '["python","go"]').
# Default is a single auto-detected pass ("auto").
#
# Expect 60-180 minutes and $50-150 per language job on a medium-sized repo.

on:
  schedule:
    - cron: '0 2 * * 1,3'   # Monday + Wednesday 02:00 UTC
  workflow_dispatch:
    inputs:
      languages:
        description: >
          Language(s) to scan — JSON array or single value.
          Examples: auto  |  python  |  ["python","go","javascript"]
        required: false
        default: 'auto'
      level:
        description: 'Processing level (all / reachable / codeql / exploitable)'
        required: false
        default: 'reachable'
      limit:
        description: 'Max units to analyse per language job (0 = no limit)'
        required: false
        default: '0'
      cost_threshold_usd:
        description: 'Warn at 80%, fail above this cost per language job (USD)'
        required: false
        default: '100'

permissions:
  contents: read
  security-events: write   # upload SARIF
  issues: write            # open issue on failure

jobs:
  # ------------------------------------------------------------------ Matrix setup
  # Normalises the `languages` input (single string or JSON array) into a JSON
  # array consumed by the matrix strategy in the audit job.
  setup-matrix:
    name: Resolve language matrix
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.resolve.outputs.languages }}
    steps:
      - name: Resolve language matrix
        id: resolve
        run: |
          RAW="${{ github.event.inputs.languages || 'auto' }}"
          # If the value already looks like a JSON array, use it directly.
          if echo "$RAW" | grep -qE '^\['; then
            LANGS="$RAW"
          else
            LANGS="[\"${RAW}\"]"
          fi
          echo "languages=${LANGS}" >> "$GITHUB_OUTPUT"
          echo "Matrix languages: ${LANGS}"

  # ------------------------------------------------------------------ Audit
  audit:
    name: Full security audit (${{ matrix.language }})
    needs: setup-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.setup-matrix.outputs.languages) }}

    steps:
      # ------------------------------------------------------------------ Checkout
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------------ Setup
      - name: Setup OpenAnt
        uses: ./.github/actions/setup-openant

      # ------------------------------------------------------------------ Scan
      - name: Run full security audit
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/openant-audit

          LANGUAGE="${{ matrix.language }}"
          LEVEL="${{ github.event.inputs.level || 'reachable' }}"
          LIMIT="${{ github.event.inputs.limit || '0' }}"

          EXTRA_ARGS=""
          if [ "$LIMIT" != "0" ]; then
            EXTRA_ARGS="--limit $LIMIT"
          fi

          openant --api-key "$ANTHROPIC_API_KEY" scan "$GITHUB_WORKSPACE" \
            --language "$LANGUAGE" \
            --output /tmp/openant-audit \
            --level "$LEVEL" \
            --verify \
            --enhance-mode agentic \
            --model opus \
            --workers 8 \
            $EXTRA_ARGS \
            --json \
            2>/tmp/openant-audit/stderr.log \
            | tee /tmp/openant-audit/stdout.json

          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ SARIF
      - name: Convert findings to SARIF
        if: always()
        run: |
          PIPELINE_OUTPUT="/tmp/openant-audit/pipeline_output.json"
          if [ -f "$PIPELINE_OUTPUT" ]; then
            python tools/sarif_convert.py "$PIPELINE_OUTPUT" \
              -o /tmp/openant-audit/results.sarif
          else
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"OpenAnt","version":"1.0.0","rules":[]}},"results":[]}]}\n' \
              > /tmp/openant-audit/results.sarif
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/openant-audit/results.sarif
          # Include language in category so multi-language runs get separate entries
          category: openant-nightly-${{ matrix.language }}

      # ------------------------------------------------------------------ Artifacts
      - name: Upload full audit artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openant-audit-${{ matrix.language }}-${{ github.sha }}
          path: |
            /tmp/openant-audit/report.html
            /tmp/openant-audit/report.csv
            /tmp/openant-audit/pipeline_output.json
            /tmp/openant-audit/results_verified.json
            /tmp/openant-audit/stdout.json
            /tmp/openant-audit/*.report.json
          if-no-files-found: warn
          retention-days: 90

      # ------------------------------------------------------------------ Cost summary
      - name: Print cost and metrics summary
        if: always()
        run: |
          STDOUT="/tmp/openant-audit/stdout.json"
          if [ ! -f "$STDOUT" ]; then
            echo "No scan output found."
            exit 0
          fi

          echo "## Audit Summary — ${{ matrix.language }}"
          echo ""
          echo "Units scanned:  $(jq -r '.data.units_count // "N/A"' "$STDOUT")"
          echo "Vulnerable:     $(jq -r '.data.metrics.vulnerable // "N/A"' "$STDOUT")"
          echo "Bypassable:     $(jq -r '.data.metrics.bypassable // "N/A"' "$STDOUT")"
          echo "Inconclusive:   $(jq -r '.data.metrics.inconclusive // "N/A"' "$STDOUT")"
          echo "Safe:           $(jq -r '.data.metrics.safe // "N/A"' "$STDOUT")"
          echo "Verified:       $(jq -r '.data.metrics.verified // "N/A"' "$STDOUT")"
          echo ""
          echo "Total API cost: \$$(jq -r '.data.usage.total_cost_usd // "N/A"' "$STDOUT")"
          echo "Input tokens:   $(jq -r '.data.usage.total_input_tokens // "N/A"' "$STDOUT")"
          echo "Output tokens:  $(jq -r '.data.usage.total_output_tokens // "N/A"' "$STDOUT")"

      # ------------------------------------------------------------------ Cost alert
      # Emit a warning annotation at 80% of threshold; hard-fail above it.
      - name: Check scan cost against threshold
        if: always()
        run: |
          STDOUT="/tmp/openant-audit/stdout.json"
          THRESHOLD="${{ github.event.inputs.cost_threshold_usd || '100' }}"

          if [ ! -f "$STDOUT" ]; then exit 0; fi

          COST=$(jq -r '.data.usage.total_cost_usd // 0' "$STDOUT" 2>/dev/null || echo 0)

          OVER=$(awk -v c="$COST" -v t="$THRESHOLD" 'BEGIN { print (c+0 > t+0) ? 1 : 0 }')
          WARN=$(awk -v c="$COST" -v t="$THRESHOLD" 'BEGIN { print (c+0 > t*0.8) ? 1 : 0 }')

          if [ "$OVER" = "1" ]; then
            echo "::error::[${{ matrix.language }}] Scan cost \$${COST} exceeded threshold \$${THRESHOLD}. Consider reducing --limit or scope."
            exit 1
          elif [ "$WARN" = "1" ]; then
            echo "::warning::[${{ matrix.language }}] Scan cost \$${COST} is above 80% of the \$${THRESHOLD} threshold."
          else
            echo "[${{ matrix.language }}] Scan cost \$${COST} is within the \$${THRESHOLD} threshold."
          fi

      # ------------------------------------------------------------------ Open issue on findings
      - name: Open GitHub issue if vulnerabilities confirmed
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PIPELINE_OUTPUT="/tmp/openant-audit/pipeline_output.json"
          if [ ! -f "$PIPELINE_OUTPUT" ]; then
            exit 0
          fi

          VULNERABLE=$(jq '[.findings[] | select(.stage1_verdict == "vulnerable")] | length' \
                       "$PIPELINE_OUTPUT" 2>/dev/null || echo 0)
          BYPASSABLE=$(jq '[.findings[] | select(.stage1_verdict == "bypassable")] | length' \
                       "$PIPELINE_OUTPUT" 2>/dev/null || echo 0)

          if [ "$VULNERABLE" -eq 0 ] && [ "$BYPASSABLE" -eq 0 ]; then
            echo "No confirmed findings — skipping issue creation."
            exit 0
          fi

          FINDING_ROWS=$(jq -r '
            .findings[:20][]
            | select(.stage1_verdict == "vulnerable" or .stage1_verdict == "bypassable")
            | "| `\(.location.file)` | \(.location.function) | \(.stage1_verdict | ascii_upcase) | \(.name) |"
          ' "$PIPELINE_OUTPUT" 2>/dev/null || echo "")

          FINDING_TABLE=""
          if [ -n "$FINDING_ROWS" ]; then
            FINDING_TABLE="## Findings

          | File | Function | Verdict | Type |
          |------|----------|---------|------|
          ${FINDING_ROWS}"
          fi

          LANG="${{ matrix.language }}"
          LANG_TAG=$([ "$LANG" = "auto" ] && echo "" || echo " [${LANG}]")

          cat > /tmp/issue-body.md <<EOF
          ## OpenAnt Nightly Audit${LANG_TAG} — $(date -u '+%Y-%m-%d')

          The scheduled security audit found **${VULNERABLE}** confirmed vulnerabilit$([ $VULNERABLE -eq 1 ] && echo y || echo ies) and **${BYPASSABLE}** finding$([ $BYPASSABLE -eq 1 ] && echo '' || echo s) with bypassable controls.

          ${FINDING_TABLE}

          **Workflow run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Full report and SARIF are available as workflow artifacts (retained for 90 days).
          See the [Security → Code scanning](${{ github.server_url }}/${{ github.repository }}/security/code-scanning) view for annotated findings.

          <sub>Opened automatically by OpenAnt nightly audit · language: \`${{ matrix.language }}\` · commit \`${{ github.sha }}\`</sub>
          EOF

          TITLE="[OpenAnt] Security findings${LANG_TAG} — $(date -u '+%Y-%m-%d') (${VULNERABLE} vulnerable, ${BYPASSABLE} bypassable)"

          EXISTING=$(gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --search "$TITLE" \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already exists for today — updating."
            gh issue edit "$EXISTING" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/issue-body.md
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body-file /tmp/issue-body.md \
              --label "security"
          fi
