name: OpenAnt Security Scan (PR)

# Runs on every PR targeting main/master.
# Goal: fast signal — scope the scan to changed source files only, verify findings,
# post a comment on the PR, upload SARIF to the Security tab, and fail if
# any confirmed vulnerabilities are found (after suppressions are applied).
#
# Cost guard: the unit limit is derived from the number of changed source files
# (5x file count, min 20). If changes span the full workspace, --limit 50 applies.

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  pull-requests: write       # post PR comment
  security-events: write     # upload SARIF

jobs:
  scan:
    name: OpenAnt vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # ------------------------------------------------------------------ Checkout
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # ------------------------------------------------------------------ Setup
      - name: Setup OpenAnt
        uses: ./.github/actions/setup-openant

      # ------------------------------------------------------------------ Diff scope
      # Compute the narrowest scan target from changed source files.
      # If all changes share a common subdirectory, scan that; otherwise fall back
      # to the full workspace. Unit limit scales with the number of changed files.
      - name: Compute PR diff scope
        id: diff
        run: |
          BASE="origin/${GITHUB_BASE_REF}"
          CHANGED=$(git diff --name-only "${BASE}...HEAD" 2>/dev/null || \
                    git diff --name-only "HEAD~1" 2>/dev/null || true)

          SCAN_TARGET="$GITHUB_WORKSPACE"
          UNIT_LIMIT="50"

          if [ -n "$CHANGED" ]; then
            # Filter to source files only
            SOURCE_FILES=$(echo "$CHANGED" \
              | grep -E '\.(py|js|ts|go|rb|java|php|c|cpp|rs|cs|jsx|tsx|vue|svelte)$' || true)

            if [ -n "$SOURCE_FILES" ]; then
              FILE_COUNT=$(echo "$SOURCE_FILES" | wc -l | tr -d ' ')

              # Build absolute directory paths for each changed source file
              echo "$SOURCE_FILES" \
                | while IFS= read -r f; do dirname "${GITHUB_WORKSPACE}/${f}"; done \
                | sort -u > /tmp/changed-dirs.txt

              # Find the common ancestor directory
              COMMON=$(python3 - <<'PYEOF'
import os, sys
with open('/tmp/changed-dirs.txt') as fh:
    dirs = [l.strip() for l in fh if l.strip()]
if not dirs:
    print(os.environ['GITHUB_WORKSPACE'])
elif len(dirs) == 1:
    print(dirs[0])
else:
    common = os.path.commonpath(dirs)
    print(common)
PYEOF
              )

              if [ -d "$COMMON" ] && [ "$COMMON" != "$GITHUB_WORKSPACE" ]; then
                SCAN_TARGET="$COMMON"
                # Scale limit: 5 units per changed file, min 20, max 200
                UNIT_LIMIT=$(python3 -c "print(min(200, max(20, ${FILE_COUNT} * 5)))")
                echo "Diff-scoped: ${SCAN_TARGET} (${FILE_COUNT} changed source files, limit ${UNIT_LIMIT})"
              else
                echo "Changes span full workspace — using default target and limit ${UNIT_LIMIT}."
              fi
            else
              echo "No source file changes detected (docs/config only) — using full workspace."
            fi
          else
            echo "Could not resolve diff — using full workspace."
          fi

          echo "scan_target=${SCAN_TARGET}" >> "$GITHUB_OUTPUT"
          echo "unit_limit=${UNIT_LIMIT}" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ Scan
      - name: Run security scan
        id: scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p /tmp/openant-results

          SCAN_TARGET="${{ steps.diff.outputs.scan_target }}"
          UNIT_LIMIT="${{ steps.diff.outputs.unit_limit }}"

          openant --api-key "$ANTHROPIC_API_KEY" scan "$SCAN_TARGET" \
            --language auto \
            --output /tmp/openant-results \
            --level reachable \
            --verify \
            --enhance-mode single-shot \
            --model sonnet \
            --limit "$UNIT_LIMIT" \
            --no-report \
            --workers 8 \
            --json \
            2>/tmp/openant-stderr.log \
            | tee /tmp/openant-stdout.json

          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------------ SARIF
      - name: Convert findings to SARIF
        if: always()
        run: |
          PIPELINE_OUTPUT="/tmp/openant-results/pipeline_output.json"
          if [ -f "$PIPELINE_OUTPUT" ]; then
            python tools/sarif_convert.py "$PIPELINE_OUTPUT" \
              -o /tmp/openant-results/results.sarif
          else
            printf '{"$schema":"https://json.schemastore.org/sarif-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"OpenAnt","version":"1.0.0","rules":[]}},"results":[]}]}\n' \
              > /tmp/openant-results/results.sarif
          fi

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: /tmp/openant-results/results.sarif
          category: openant

      # ------------------------------------------------------------------ Suppressions
      # Filter pipeline_output.json against .openant-suppress.yml so that
      # accepted/reviewed findings don't block the PR gate.
      - name: Apply suppressions
        id: suppress
        if: always()
        run: |
          PIPELINE_OUTPUT="/tmp/openant-results/pipeline_output.json"
          FILTERED_OUTPUT="/tmp/openant-results/pipeline_output_filtered.json"
          SUPPRESS_FILE=".openant-suppress.yml"

          if [ ! -f "$PIPELINE_OUTPUT" ]; then
            echo "No pipeline output to filter."
            exit 0
          fi

          if [ -f "$SUPPRESS_FILE" ]; then
            python tools/apply_suppressions.py \
              --input "$PIPELINE_OUTPUT" \
              --suppressions "$SUPPRESS_FILE" \
              --output "$FILTERED_OUTPUT" \
              --report /tmp/suppression-report.txt
            echo "--- Suppression report ---"
            cat /tmp/suppression-report.txt 2>/dev/null || true
          else
            cp "$PIPELINE_OUTPUT" "$FILTERED_OUTPUT"
            echo "No .openant-suppress.yml found — all findings active."
          fi

      # ------------------------------------------------------------------ PR comment
      - name: Post scan summary as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PIPELINE_OUTPUT="/tmp/openant-results/pipeline_output.json"
          FILTERED_OUTPUT="/tmp/openant-results/pipeline_output_filtered.json"
          STDOUT="/tmp/openant-stdout.json"

          VULNERABLE=0; BYPASSABLE=0; INCONCLUSIVE=0; TOTAL=0; COST="N/A"; SUPPRESSED=0

          if [ -f "$STDOUT" ]; then
            VULNERABLE=$(jq -r '.data.metrics.vulnerable // 0'   "$STDOUT" 2>/dev/null || echo 0)
            BYPASSABLE=$(jq -r '.data.metrics.bypassable // 0'   "$STDOUT" 2>/dev/null || echo 0)
            INCONCLUSIVE=$(jq -r '.data.metrics.inconclusive // 0' "$STDOUT" 2>/dev/null || echo 0)
            TOTAL=$(jq -r '.data.units_count // 0'              "$STDOUT" 2>/dev/null || echo 0)
            RAW_COST=$(jq -r '.data.usage.total_cost_usd // 0'  "$STDOUT" 2>/dev/null || echo 0)
            COST=$(printf '$%.2f' "$RAW_COST" 2>/dev/null || echo "N/A")
          fi

          # Count suppressed findings
          if [ -f "$FILTERED_OUTPUT" ] && [ -f "$PIPELINE_OUTPUT" ]; then
            ORIG=$(jq '[.findings[] | select(.stage1_verdict == "vulnerable" or .stage1_verdict == "bypassable")] | length' "$PIPELINE_OUTPUT" 2>/dev/null || echo 0)
            FILT=$(jq '[.findings[] | select(.stage1_verdict == "vulnerable" or .stage1_verdict == "bypassable")] | length' "$FILTERED_OUTPUT" 2>/dev/null || echo 0)
            SUPPRESSED=$(( ORIG - FILT ))
          fi

          # Read filtered counts for badge
          if [ -f "$FILTERED_OUTPUT" ]; then
            VULNERABLE=$(jq '[.findings[] | select(.stage1_verdict == "vulnerable")] | length' "$FILTERED_OUTPUT" 2>/dev/null || echo $VULNERABLE)
            BYPASSABLE=$(jq '[.findings[] | select(.stage1_verdict == "bypassable")] | length' "$FILTERED_OUTPUT" 2>/dev/null || echo $BYPASSABLE)
          fi

          if [ "$VULNERABLE" -gt 0 ] || [ "$BYPASSABLE" -gt 0 ]; then
            BADGE="🔴 **Vulnerabilities confirmed**"
          elif [ "$INCONCLUSIVE" -gt 0 ]; then
            BADGE="🟡 **Needs manual review**"
          else
            BADGE="🟢 **No confirmed vulnerabilities**"
          fi

          FINDING_LINES=""
          if [ -f "$FILTERED_OUTPUT" ]; then
            FINDING_LINES=$(jq -r '
              .findings[:10][]
              | "| `\(.location.file)` | \(.location.function) | \(.stage1_verdict | ascii_upcase) | \(.name) |"
            ' "$FILTERED_OUTPUT" 2>/dev/null || echo "")
          fi

          FINDING_TABLE=""
          if [ -n "$FINDING_LINES" ]; then
            FINDING_TABLE="
          ### Findings

          | File | Function | Verdict | Type |
          |------|----------|---------|------|
          ${FINDING_LINES}
          "
          fi

          SUPPRESS_NOTE=""
          if [ "$SUPPRESSED" -gt 0 ]; then
            SUPPRESS_NOTE="
          > **${SUPPRESSED}** finding(s) suppressed via \`.openant-suppress.yml\`."
          fi

          SCAN_TARGET="${{ steps.diff.outputs.scan_target }}"
          SCAN_SCOPE="Full workspace"
          if [ "$SCAN_TARGET" != "$GITHUB_WORKSPACE" ]; then
            SCAN_SCOPE="\`${SCAN_TARGET#$GITHUB_WORKSPACE/}\`"
          fi

          cat > /tmp/pr-comment.md <<EOF
          ## OpenAnt Security Scan

          ${BADGE}

          | Metric | Value |
          |--------|-------|
          | Scan scope | ${SCAN_SCOPE} |
          | Units scanned | ${TOTAL} |
          | Confirmed vulnerable | ${VULNERABLE} |
          | Bypassable controls | ${BYPASSABLE} |
          | Inconclusive | ${INCONCLUSIVE} |
          | LLM cost | ${COST} |

          ${FINDING_TABLE}

          ${SUPPRESS_NOTE}

          > Scan used Stage 1 detection + Stage 2 attacker simulation.
          > Security tab: see **Security → Code scanning** for annotated findings.

          <sub>OpenAnt · commit \`${{ github.sha }}\`</sub>
          EOF

          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/pr-comment.md \
            --edit-last \
            || \
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file /tmp/pr-comment.md

      # ------------------------------------------------------------------ Fail gate
      # Reads from the suppression-filtered output so accepted findings don't block.
      - name: Fail if confirmed vulnerabilities found
        run: |
          FILTERED_OUTPUT="/tmp/openant-results/pipeline_output_filtered.json"
          PIPELINE_OUTPUT="/tmp/openant-results/pipeline_output.json"

          # Prefer filtered; fall back to original if suppression step didn't run
          TARGET="${FILTERED_OUTPUT:-$PIPELINE_OUTPUT}"
          [ -f "$FILTERED_OUTPUT" ] && TARGET="$FILTERED_OUTPUT" || TARGET="$PIPELINE_OUTPUT"

          if [ ! -f "$TARGET" ]; then
            echo "::warning::pipeline_output not found — scan may have errored"
            exit 0
          fi

          VULNERABLE=$(jq '[.findings[] | select(.stage1_verdict == "vulnerable")] | length' \
                       "$TARGET" 2>/dev/null || echo 0)
          BYPASSABLE=$(jq '[.findings[] | select(.stage1_verdict == "bypassable")] | length' \
                       "$TARGET" 2>/dev/null || echo 0)

          echo "Confirmed vulnerable: ${VULNERABLE}"
          echo "Bypassable controls:  ${BYPASSABLE}"

          if [ "$VULNERABLE" -gt 0 ]; then
            echo "::error::${VULNERABLE} confirmed vulnerabilit$([ $VULNERABLE -eq 1 ] && echo y || echo ies) found. Review the Security tab or PR comment."
            exit 1
          fi
          if [ "$BYPASSABLE" -gt 0 ]; then
            echo "::warning::${BYPASSABLE} finding$([ $BYPASSABLE -eq 1 ] && echo '' || echo s) with bypassable controls. Review before merging."
          fi
